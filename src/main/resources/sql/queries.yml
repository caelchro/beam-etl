
proceso:
  iniciar: |
    INSERT INTO etl_proceso DEFAULT VALUES
    RETURNING proceso_id

  actualizarContadores: |
    UPDATE etl_proceso
    SET total_leidos = ?,
        total_validos = ?,
        total_rechazados = ?
    WHERE proceso_id = ?

  finalizar: |
    UPDATE etl_proceso
    SET fecha_termino = CURRENT_TIMESTAMP,
        estado = ?,
        mensaje_error = ?
    WHERE proceso_id = ?
  borrarProceso: |
    DELETE FROM etl_proceso
    WHERE proceso_id = ?

staging:
  insertar: |
    INSERT INTO staging_clientes (
        proceso_id, linea_original,
        cliente_id, nombre, email, estado, motivo_rechazo
    )
    VALUES (?, ?, ?, ?, ?, ?, ?)
  getAllByProceso: |
    SELECT proceso_id, linea_original,
        cliente_id, nombre, email, estado, motivo_rechazo
    FROM staging_clientes
    WHERE proceso_id = ?
  borrarByProceso: |
    DELETE FROM staging_clientes
    WHERE proceso_id = ?

cliente:
  getAll: |
    SELECT cliente_id, nombre, email
    FROM clientes

  insertar: |
    INSERT INTO clientes (cliente_id, nombre, email)
    VALUES (?, ?, ?)

  upsertDesdeStaging:
    INSERT INTO clientes (cliente_id, nombre, email)
      SELECT DISTINCT ON (cliente_id)
            cliente_id,
            nombre,
            email
      FROM staging_clientes
      WHERE proceso_id = ?
        AND estado = 'VALIDO'
      ORDER BY cliente_id, staging_id
      ON CONFLICT (cliente_id)
      DO UPDATE SET
          nombre = EXCLUDED.nombre,
          email = EXCLUDED.email
      WHERE (clientes.nombre, clientes.email)
            IS DISTINCT FROM
            (EXCLUDED.nombre, EXCLUDED.email)

rechazado:
  insertar: |
    INSERT INTO clientes_rechazados (
        proceso_id, linea_original, motivo
    )
    VALUES (?, ?, ?)

  getAll: |
    SELECT *
    FROM clientes_rechazados
    ORDER BY rechazo_id

  insertarDesdeStaging:
    INSERT INTO clientes_rechazados (
        proceso_id,
        linea_original,
        motivo
    )
    SELECT
        proceso_id,
        linea_original,
        motivo_rechazo
    FROM staging_clientes
    WHERE proceso_id = ?
      AND estado = 'RECHAZADO'
